<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="music-player">
        <h1>🎵 My Music Player</h1>

        <div class="album-art">🎧</div>

        <h2 id="songTitle">Song One</h2>
        <p id="artist">My Favourite Artist</p>

        <audio id="audio"></audio>

        <div class="progress-container">
            <span id="currentTime">0:00</span>
            <input type="range" id="progress" value="0" min="0" max="100">
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button id="prevBtn" aria-label="Previous song">⏮️</button>
            <button id="playBtn" aria-label="Play music">▶️</button>
            <button id="nextBtn" aria-label="Next song">⏭️</button>
        </div>

        <div class="volume-container">
            <label for="volume">🔊 Volume</label>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
        </div>

        <h3>🎶 Playlist</h3>
        <ul id="playlist"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
